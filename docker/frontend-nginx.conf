server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静的ファイルが存在すればそのまま返し、
    # それ以外は SPA の入口である index.html を返す。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 配信だけが目的なので、最小限のエラーページ設定に留める。
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
