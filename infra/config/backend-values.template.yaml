systemName: sample-system

ingress:
  enabled: true
  standard:
    ingressClassName: azure-application-gateway
    annotations: {}
    host: api.example.com
    paths:
      - path: /backend
        pathType: Prefix
  lowLatency:
    enabled: true
    ingressClassName: azure-application-gateway-low-latency
    annotations: {}
    host: ll-api.example.com
    # 低遅延系は限定 API のみを公開する
    paths:
      - path: /backend/realtime
        pathType: Prefix

api:
  enabled: true
  replicaCount: 1
  image:
    repository: example.azurecr.io/sample-system-api
    tag: __IMAGE_TAG__
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  podAnnotations: {}
  resources: {}

workers:
  authAuditExport:
    enabled: true
    replicaCount: 1
    image:
      repository: example.azurecr.io/sample-system-worker
      tag: __IMAGE_TAG__
      pullPolicy: IfNotPresent
    queueName: auth-audit-export
    workerModule: app.workers.entrypoints.auth_audit_export
    keda:
      enabled: true
      pollingInterval: 30
      cooldownPeriod: 300
      minReplicaCount: 0
      maxReplicaCount: 5
      queueLengthThreshold: 1
    podAnnotations: {}
    resources: {}
  sampleWaitBlob:
    enabled: true
    replicaCount: 1
    image:
      repository: example.azurecr.io/sample-system-worker
      tag: __IMAGE_TAG__
      pullPolicy: IfNotPresent
    queueName: sample-wait-blob
    workerModule: app.workers.entrypoints.sample_wait_blob
    keda:
      enabled: true
      pollingInterval: 30
      cooldownPeriod: 300
      minReplicaCount: 0
      maxReplicaCount: 5
      queueLengthThreshold: 1
    podAnnotations: {}
    resources: {}

keda:
  enabled: true
  triggerAuthenticationName: r-sample-system-worker-trigger-auth
  workloadIdentity:
    clientId: "00000000-0000-0000-0000-000000000000"

schedulers:
  image:
    repository: example.azurecr.io/sample-system-schedulers
    tag: __IMAGE_TAG__
    pullPolicy: IfNotPresent
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobs:
    sessions:
      enabled: true
      schedule: "0 * * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: sessions
      podAnnotations: {}
      resources: {}
    audit:
      enabled: true
      schedule: "0 2 * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: audit
      podAnnotations: {}
      resources: {}
    jobs:
      enabled: true
      schedule: "15 * * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: jobs
      podAnnotations: {}
      resources: {}

keyVault:
  enabled: true
  secretProviderClassName: backend-secrets
  secretName: backend-secrets
  vaultName: kv-example
  tenantId: 00000000-0000-0000-0000-000000000000
  objects:
    databaseUrl:
      keyVaultName: database-url
      secretKey: DATABASE_URL
    sessionSecretKey:
      keyVaultName: session-secret-key
      secretKey: SESSION_SECRET_KEY
    entraClientSecret:
      keyVaultName: entra-client-secret
      secretKey: ENTRA_CLIENT_SECRET
    entraTokenEncryptionKey:
      keyVaultName: entra-token-encryption-key
      secretKey: ENTRA_TOKEN_ENCRYPTION_KEY

serviceAccounts:
  api:
    create: true
    name: sa-sample-system-api
    clientId: "00000000-0000-0000-0000-000000000000"
    annotations: {}
  worker:
    create: true
    name: sa-sample-system-worker
    clientId: "00000000-0000-0000-0000-000000000000"
    annotations: {}
  schedulers:
    create: true
    name: sa-sample-system-schedulers
    clientId: "00000000-0000-0000-0000-000000000000"
    annotations: {}

config:
  enabled: true
  env:
    SERVICE_NAME: sample-system-api
    API_LOG_LEVEL: INFO
    FRONTEND_BASE_URL: https://app.example.com
    AUTH_POST_LOGIN_DEFAULT_PATH: /en
    CSRF_TRUSTED_ORIGINS: https://app.example.com
    SESSION_COOKIE_NAME: app_session
    SESSION_COOKIE_SECURE: "false"
    SESSION_COOKIE_SAMESITE: lax
    ASYNC_JOBS_ENABLED: "true"
    SERVICE_BUS_NAMESPACE_FQDN: sb-example.servicebus.windows.net
    SERVICE_BUS_AUTH_AUDIT_EXPORT_QUEUE_NAME: auth-audit-export
    SERVICE_BUS_SAMPLE_WAIT_BLOB_QUEUE_NAME: sample-wait-blob
    AZURE_BLOB_ACCOUNT_URL: https://stexample.blob.core.windows.net/
    AZURE_BLOB_CONTAINER: async-jobs
    REDIS_HOST: your-redis-name.japaneast.redis.azure.net
    REDIS_PORT: 10000
    REDIS_SSL: "true"
    RATE_LIMIT_MODE: enforce
    RATE_LIMIT_POLICY_EMAIL_LOGIN_REQUEST_WINDOW_1_SECONDS: 60
    RATE_LIMIT_POLICY_EMAIL_LOGIN_REQUEST_WINDOW_1_MAX_REQUESTS: 10
    RATE_LIMIT_POLICY_EMAIL_LOGIN_REQUEST_WINDOW_2_SECONDS: 300
    RATE_LIMIT_POLICY_EMAIL_LOGIN_REQUEST_WINDOW_2_MAX_REQUESTS: 30
    RATE_LIMIT_POLICY_EMAIL_LOGIN_FAILURE_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_EMAIL_LOGIN_MAX_FAILURES: 5
    RATE_LIMIT_POLICY_EMAIL_LOGIN_BLOCK_SECONDS: 900
    RATE_LIMIT_POLICY_EMAIL_VERIFY_RESEND_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_EMAIL_VERIFY_RESEND_MAX_REQUESTS: 5
    RATE_LIMIT_POLICY_EMAIL_VERIFY_RESEND_BLOCK_SECONDS: 1800
    RATE_LIMIT_POLICY_ENTRA_LOGIN_REQUEST_WINDOW_1_SECONDS: 60
    RATE_LIMIT_POLICY_ENTRA_LOGIN_REQUEST_WINDOW_1_MAX_REQUESTS: 20
    RATE_LIMIT_POLICY_ENTRA_LOGIN_REQUEST_WINDOW_2_SECONDS: 300
    RATE_LIMIT_POLICY_ENTRA_LOGIN_REQUEST_WINDOW_2_MAX_REQUESTS: 60
    RATE_LIMIT_POLICY_ENTRA_LOGIN_BLOCK_SECONDS: 600
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_REQUEST_WINDOW_1_SECONDS: 60
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_REQUEST_WINDOW_1_MAX_REQUESTS: 20
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_REQUEST_WINDOW_2_SECONDS: 300
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_REQUEST_WINDOW_2_MAX_REQUESTS: 60
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_FAILURE_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_MAX_FAILURES: 10
    RATE_LIMIT_POLICY_ENTRA_CALLBACK_BLOCK_SECONDS: 600
    RATE_LIMIT_POLICY_PASSWORD_RESET_REQUEST_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_PASSWORD_RESET_REQUEST_MAX_REQUESTS: 5
    RATE_LIMIT_POLICY_PASSWORD_RESET_REQUEST_BLOCK_SECONDS: 1800
    RATE_LIMIT_POLICY_PASSWORD_RESET_CONFIRM_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_PASSWORD_RESET_CONFIRM_MAX_REQUESTS: 10
    RATE_LIMIT_POLICY_PASSWORD_RESET_CONFIRM_FAILURE_WINDOW_SECONDS: 600
    RATE_LIMIT_POLICY_PASSWORD_RESET_CONFIRM_MAX_FAILURES: 5
    RATE_LIMIT_POLICY_PASSWORD_RESET_CONFIRM_BLOCK_SECONDS: 1800
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_REQUEST_WINDOW_1_SECONDS: 600
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_REQUEST_WINDOW_1_MAX_REQUESTS: 5
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_REQUEST_WINDOW_2_SECONDS: 3600
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_REQUEST_WINDOW_2_MAX_REQUESTS: 10
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_FAILURE_WINDOW_SECONDS: 1800
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_MAX_FAILURES: 5
    RATE_LIMIT_POLICY_EMAIL_SIGNUP_BLOCK_SECONDS: 1200
    TRUST_PROXY_HEADERS: "false"
    TRUSTED_PROXY_CIDRS: ""
    ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
    ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
    ENTRA_REDIRECT_URI: https://api.example.com/backend/auth/entra/callback
    ENTRA_INTERNAL_DOMAINS: example.com

secretRefs:
  create: false
  name: backend-secrets
  keys:
    databaseUrl: DATABASE_URL
    sessionSecretKey: SESSION_SECRET_KEY
    entraClientSecret: ENTRA_CLIENT_SECRET
    entraTokenEncryptionKey: ENTRA_TOKEN_ENCRYPTION_KEY
