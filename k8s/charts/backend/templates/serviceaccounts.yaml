{{- $root := . -}}
{{- range $workload, $account := .Values.serviceAccounts }}
{{- if $account.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account.name }}
  namespace: {{ include "backend.namespace" $root }}
  labels:
    {{- include "backend.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $workload }}
  annotations:
    {{- if $account.clientId }}
    azure.workload.identity/client-id: {{ $account.clientId | quote }}
    {{- end }}
    {{- with $account.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
---
{{- end }}
{{- end }}
