{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyVault.secretProviderClassName }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.keyVault.secretName }}
      type: Opaque
      data:
        - key: {{ .Values.keyVault.objects.databaseUrl.secretKey }}
          objectName: {{ .Values.keyVault.objects.databaseUrl.secretKey }}
        - key: {{ .Values.keyVault.objects.sessionSecretKey.secretKey }}
          objectName: {{ .Values.keyVault.objects.sessionSecretKey.secretKey }}
        - key: {{ .Values.keyVault.objects.entraClientSecret.secretKey }}
          objectName: {{ .Values.keyVault.objects.entraClientSecret.secretKey }}
        - key: {{ .Values.keyVault.objects.entraTokenEncryptionKey.secretKey }}
          objectName: {{ .Values.keyVault.objects.entraTokenEncryptionKey.secretKey }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccounts.api.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.vaultName | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.objects.databaseUrl.keyVaultName }}
          objectAlias: {{ .Values.keyVault.objects.databaseUrl.secretKey }}
          objectType: secret
          objectVersion: ""
        - |
          objectName: {{ .Values.keyVault.objects.sessionSecretKey.keyVaultName }}
          objectAlias: {{ .Values.keyVault.objects.sessionSecretKey.secretKey }}
          objectType: secret
          objectVersion: ""
        - |
          objectName: {{ .Values.keyVault.objects.entraClientSecret.keyVaultName }}
          objectAlias: {{ .Values.keyVault.objects.entraClientSecret.secretKey }}
          objectType: secret
          objectVersion: ""
        - |
          objectName: {{ .Values.keyVault.objects.entraTokenEncryptionKey.keyVaultName }}
          objectAlias: {{ .Values.keyVault.objects.entraTokenEncryptionKey.secretKey }}
          objectType: secret
          objectVersion: ""
{{- end }}
