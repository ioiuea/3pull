{{- $root := . -}}
{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.workerName" $root }}-{{ $name | kebabcase }}
  namespace: {{ include "backend.namespace" $root }}
  labels:
    {{- include "backend.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: {{ $name | kebabcase }}
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/part-of: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: {{ $name | kebabcase }}
        azure.workload.identity/use: "true"
      {{- with $worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $root.Values.serviceAccounts.worker.name }}
      containers:
        - name: {{ $name | kebabcase }}
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag }}"
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          env:
            - name: WORKER_MODULE
              value: {{ $worker.workerModule | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "backend.apiName" $root }}-config
            - secretRef:
                name: {{ $root.Values.secretRefs.name }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
---
{{- end }}
{{- end }}
