{{- if and .Values.ingress.enabled .Values.api.enabled .Values.ingress.standard.host }}
{{- $standardAnnotations := dict }}
{{- if .Values.ingress.standard.ingressClassName }}
{{- $_ := set $standardAnnotations "kubernetes.io/ingress.class" .Values.ingress.standard.ingressClassName }}
{{- end }}
{{- $_ := set $standardAnnotations "appgw.ingress.kubernetes.io/health-probe-path" "/readyz" }}
{{- $_ := set $standardAnnotations "appgw.ingress.kubernetes.io/health-probe-timeout" "30" }}
{{- $_ := set $standardAnnotations "appgw.ingress.kubernetes.io/health-probe-interval" "30" }}
{{- range $key, $value := .Values.ingress.standard.annotations }}
{{- $_ := set $standardAnnotations $key $value }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend.apiName" . }}-standard
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if gt (len $standardAnnotations) 0 }}
  annotations:
    {{- toYaml $standardAnnotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.standard.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.standard.host }}
      http:
        paths:
          {{- if .Values.ingress.standard.paths }}
          {{- range .Values.ingress.standard.paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "backend.apiName" $ }}
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
          {{- else }}
          - path: {{ default "/" .Values.ingress.standard.path }}
            pathType: {{ default "Prefix" .Values.ingress.standard.pathType }}
            backend:
              service:
                name: {{ include "backend.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
---
{{- end }}
{{- if and .Values.ingress.enabled .Values.api.enabled .Values.ingress.lowLatency.enabled .Values.ingress.lowLatency.host }}
{{- $lowLatencyAnnotations := dict }}
{{- if .Values.ingress.lowLatency.ingressClassName }}
{{- $_ := set $lowLatencyAnnotations "kubernetes.io/ingress.class" .Values.ingress.lowLatency.ingressClassName }}
{{- end }}
{{- $_ := set $lowLatencyAnnotations "appgw.ingress.kubernetes.io/health-probe-path" "/readyz" }}
{{- $_ := set $lowLatencyAnnotations "appgw.ingress.kubernetes.io/health-probe-timeout" "30" }}
{{- $_ := set $lowLatencyAnnotations "appgw.ingress.kubernetes.io/health-probe-interval" "30" }}
{{- range $key, $value := .Values.ingress.lowLatency.annotations }}
{{- $_ := set $lowLatencyAnnotations $key $value }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend.apiName" . }}-low-latency
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if gt (len $lowLatencyAnnotations) 0 }}
  annotations:
    {{- toYaml $lowLatencyAnnotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.lowLatency.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.lowLatency.host }}
      http:
        paths:
          {{- if .Values.ingress.lowLatency.paths }}
          {{- range .Values.ingress.lowLatency.paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "backend.apiName" $ }}
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
          {{- else }}
          - path: {{ default "/backend/realtime" .Values.ingress.lowLatency.path }}
            pathType: {{ default "Prefix" .Values.ingress.lowLatency.pathType }}
            backend:
              service:
                name: {{ include "backend.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          {{- end }}
{{- end }}
