systemName: 3pull

api:
  enabled: true
  replicaCount: 1
  image:
    repository: cr3pulltest.azurecr.io/3pull-api
    tag: 20260303-01
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  podAnnotations: {}
  resources: {}

workers:
  authAuditExport:
    enabled: true
    replicaCount: 1
    image:
      repository: cr3pulltest.azurecr.io/3pull-worker
      tag: 20260303-01
      pullPolicy: IfNotPresent
    queueName: auth-audit-export
    workerModule: app.workers.entrypoints.auth_audit_export
    keda:
      enabled: true
      pollingInterval: 30
      cooldownPeriod: 300
      minReplicaCount: 0
      maxReplicaCount: 5
      queueLengthThreshold: 1
    podAnnotations: {}
    resources: {}
  sampleWaitBlob:
    enabled: true
    replicaCount: 1
    image:
      repository: cr3pulltest.azurecr.io/3pull-worker
      tag: 20260303-01
      pullPolicy: IfNotPresent
    queueName: sample-wait-blob
    workerModule: app.workers.entrypoints.sample_wait_blob
    keda:
      enabled: true
      pollingInterval: 30
      cooldownPeriod: 300
      minReplicaCount: 0
      maxReplicaCount: 5
      queueLengthThreshold: 1
    podAnnotations: {}
    resources: {}

keda:
  enabled: true
  triggerAuthenticationName: r-3pull-worker-trigger-auth
  workloadIdentity:
    clientId: "65f99eae-cd86-4493-b3ec-3a88c67cc512"

cleanup:
  image:
    repository: cr3pulltest.azurecr.io/3pull-cleanup
    tag: 20260303-01
    pullPolicy: IfNotPresent
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobs:
    sessions:
      enabled: true
      schedule: "0 * * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: sessions
      podAnnotations: {}
      resources: {}
    audit:
      enabled: true
      schedule: "0 2 * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: audit
      podAnnotations: {}
      resources: {}
    jobs:
      enabled: true
      schedule: "15 * * * *"
      suspend: false
      concurrencyPolicy: Forbid
      command: jobs
      podAnnotations: {}
      resources: {}

keyVault:
  enabled: true
  secretProviderClassName: backend-secrets
  secretName: backend-secrets
  vaultName: kv3pulltest
  tenantId: f3b16e80-cf34-4e90-860e-cef1ac25d9dd
  objects:
    databaseUrl:
      keyVaultName: database-url
      secretKey: DATABASE_URL
    sessionSecretKey:
      keyVaultName: session-secret-key
      secretKey: SESSION_SECRET_KEY
    entraClientSecret:
      keyVaultName: entra-client-secret
      secretKey: ENTRA_CLIENT_SECRET
    entraTokenEncryptionKey:
      keyVaultName: entra-token-encryption-key
      secretKey: ENTRA_TOKEN_ENCRYPTION_KEY

serviceAccounts:
  api:
    create: true
    name: sa-3pull-api
    clientId: "d73d245b-4fdf-4c18-b450-914d7506c0a1"
    annotations: {}
  worker:
    create: true
    name: sa-3pull-worker
    clientId: "65f99eae-cd86-4493-b3ec-3a88c67cc512"
    annotations: {}
  cleanup:
    create: true
    name: sa-3pull-cleanup
    clientId: "96d3c6bf-1964-4ce0-bc83-4cc1fe3e0ccb"
    annotations: {}

config:
  enabled: true
  env:
    SERVICE_NAME: 3pull-api
    API_LOG_LEVEL: INFO
    API_PORT: "8000"
    FRONTEND_BASE_URL: http://localhost:3000
    AUTH_POST_LOGIN_DEFAULT_PATH: /en
    CSRF_TRUSTED_ORIGINS: http://localhost:3000
    SESSION_COOKIE_NAME: app_session
    SESSION_COOKIE_SECURE: "false"
    SESSION_COOKIE_SAMESITE: lax
    ASYNC_JOBS_ENABLED: "true"
    SERVICE_BUS_NAMESPACE_FQDN: sb-3pull-test.servicebus.windows.net
    SERVICE_BUS_AUTH_AUDIT_EXPORT_QUEUE_NAME: auth-audit-export
    SERVICE_BUS_SAMPLE_WAIT_BLOB_QUEUE_NAME: sample-wait-blob
    AZURE_BLOB_ACCOUNT_URL: https://storage3pulltest.blob.core.windows.net/
    AZURE_BLOB_CONTAINER: async-jobs
    ENTRA_TENANT_ID: 9d252ced-a744-45c1-a42f-9116a0ab846d
    ENTRA_CLIENT_ID: ecaf6d08-70a6-47b5-b7c2-0d91c49fe259
    ENTRA_REDIRECT_URI: http://localhost:8000/backend/auth/entra/callback
    ENTRA_INTERNAL_DOMAINS: 1rqtr6.onmicrosoft.com

secretRefs:
  create: false
  name: backend-secrets
  keys:
    databaseUrl: DATABASE_URL
    sessionSecretKey: SESSION_SECRET_KEY
    entraClientSecret: ENTRA_CLIENT_SECRET
    entraTokenEncryptionKey: ENTRA_TOKEN_ENCRYPTION_KEY
