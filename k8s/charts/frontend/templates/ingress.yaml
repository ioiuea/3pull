{{- if and .Values.ingress.enabled .Values.frontend.enabled .Values.ingress.standard.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontend.webName" . }}-standard
  namespace: {{ include "frontend.namespace" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.standard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.standard.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.standard.host }}
      http:
        paths:
          {{- if .Values.ingress.standard.paths }}
          {{- range .Values.ingress.standard.paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "frontend.webName" $ }}
                port:
                  number: {{ $.Values.frontend.service.port }}
          {{- end }}
          {{- else }}
          - path: {{ default "/" .Values.ingress.standard.path }}
            pathType: {{ default "Prefix" .Values.ingress.standard.pathType }}
            backend:
              service:
                name: {{ include "frontend.webName" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
{{- end }}
